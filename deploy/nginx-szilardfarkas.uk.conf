# /etc/nginx/sites-available/szilardfarkas.uk
# Static portfolio. Certificates managed by certbot (paths kept from the existing config).

# Security headers in a snippet so they apply to every response incl. errors.
map $sent_http_content_type $csp_header {
    default "";
    ~text/html "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
}

server {
    listen 80;
    listen [::]:80;
    server_name szilardfarkas.uk www.szilardfarkas.uk;
    return 301 https://szilardfarkas.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.szilardfarkas.uk;
    ssl_certificate     /etc/letsencrypt/live/szilardfarkas.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szilardfarkas.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://szilardfarkas.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name szilardfarkas.uk;

    ssl_certificate     /etc/letsencrypt/live/szilardfarkas.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szilardfarkas.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/szilardfarkas.uk;
    index index.html;
    server_tokens off;
    charset utf-8;

    # --- headers (OWASP secure headers) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $csp_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/wasm;

    # --- /lab/ : DEADBAND (Rust/WASM game). Lives OUTSIDE the webroot so the
    # rsync --delete in deploy.sh never touches it. ^~ beats the regex caches.
    # WebAssembly needs 'wasm-unsafe-eval'; every other header stays strict.
    location ^~ /lab/ {
        alias /var/www/lab/;
        index index.html;
        types { application/wasm wasm; text/html html; text/css css; application/javascript js; }
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- caching ---
    location ~* \.(?:css|js)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }

    # block dotfiles and anything that should never be served
    location ~ /\. { deny all; return 404; }
    location ~* \.(?:py|md|sh|conf|log|bak|orig|env)$ { deny all; return 404; }

    # only GET/HEAD make sense for a static site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
